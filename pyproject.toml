[project]
name = "alzspeech"
version = "0.1.0"
description = "Open-source Alzheimer's disease detection from spontaneous speech (ADReSSo)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "Homi" }]

dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.40",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
